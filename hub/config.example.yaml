# Sample configuration
# Log level: debug, info, warn or error
log_level: "info"
http:
  # HTTP server IPv4 host
  ipv4_host: "0.0.0.0"
  # HTTP server IPv6 host
  ipv6_host: "::"
  # HTTP server port
  port: 8080
  # Public base URL of the hub, such as https://hub.example.com. Sets the OIDC redirect URI (<public_url>/auth/callback), the only allowed Origin and whether cookies are Secure
  # public_url: ""
  metrics:
    # Enable the metrics server
    enabled: false
    # Metrics server IPv4 host
    ipv4_host: "127.0.0.1"
    # Metrics server IPv6 host
    ipv6_host: "::1"
    # Metrics server port
    port: 8081
oidc:
  # OIDC issuer URL, such as https://auth.example.com/realms/home. Required in auth.mode oidc; setting it makes oidc the default mode
  # issuer_url: ""
  # OIDC client ID. Required in auth.mode oidc
  # client_id: ""
  # OIDC client secret. Required in auth.mode oidc unless client_secret_file is set
  # client_secret: "(secret)"
  # File that holds oidc.client_secret. Wins over client_secret
  # client_secret_file: ""
  # Scopes to request. Add the scope that carries groups_claim if the provider needs one (such as groups)
  scopes: ["openid", "profile", "email"]
  # ID token claim shown as the user's name. Display only: identity is always the sub claim
  display_claim: "preferred_username"
  # ID token claim that holds the group names that backends[].groups and oidc.allowed_groups list
  groups_claim: "groups"
  # ID token claim with the user's email address, for oidc.allowed_domains and accounts an admin made by email. Used only when email_verified is true
  email_claim: "email"
  # Make an account at the first login of a sub that is not in users[], when its verified email is in allowed_domains or it is in one of allowed_groups. Off: only subs in users[] and accounts an admin made log in
  auto_create: false
  # With auto_create: email domains whose verified addresses get an account, such as example.com. * allows any verified email
  # allowed_domains: []
  # With auto_create: groups (groups_claim) whose members get an account
  # allowed_groups: []
session:
  # Key for the session and login cookies, at least 32 characters. Empty with no secret_file: the hub makes one and keeps it in its database
  # secret: "(secret)"
  # File that holds session.secret. Wins over secret
  # secret_file: ""
  # How long a login lasts
  ttl: "168h"
ui:
  # Default backend per user, as user=backend pairs. A user without one gets their first backend
  # default_backends: []
  # IANA time zone of the times on the Scheduled page, such as Europe/Berlin. Default: the server's zone (the TZ environment variable, else /etc/localtime), else UTC
  # time_zone: ""
  # How Talaria was installed, so the web UI shows commands that fit: compose, helm, aio, unraid or truenas. The install files set it. Empty: commands in a generic form
  # install: ""
store:
  # Database: sqlite (a file, for one replica only) or postgres (for one or more replicas). It holds Telegram links, link tokens, users' last seen groups, the Telegram bot's state and paired devices
  driver: "sqlite"
  # Path of the SQLite database (store.driver sqlite)
  path: "/data/hermes-hub.db"
  # PostgreSQL connection string (store.driver postgres), such as postgres://hub:password@db.example.com:5432/hub. Connect to the database directly, not through a PgBouncer pool in transaction mode: the Telegram leader lock needs its own session
  # dsn: "(secret)"
  # File that holds store.dsn. Wins over dsn
  # dsn_file: ""
  # With store.driver postgres: an SQLite database of an earlier hub to copy into PostgreSQL at startup. The copy runs once; a missing file is skipped
  # import_path: ""
shutdown:
  # How long the hub keeps serving after SIGTERM while /readyz fails, so load balancers stop sending it requests
  drain_delay: "5s"
  # How long the hub then waits for open requests and the Telegram bot to stop. Keep drain_delay plus timeout below the pod's termination grace period
  timeout: "20s"
hold:
  # How long the hub holds a message while its Hermes backend is restarting or cannot be reached. After that the user is told the message was not sent. 0 is the default
  timeout: "10m"
usage:
  # Base URL of a Prometheus query API, such as http://prometheus:9090, that scrapes the metrics of ollama-priority-proxy in front of the local GPU's Ollama. The Usage page then shows how long the GPU was busy. Empty: it does not
  # prometheus_url: ""
auth:
  # How people log in: local (accounts in the hub's database, with a setup page that makes the first one), proxy (a reverse proxy in front of the hub tells it who the user is) or oidc (an OpenID Connect provider). Default: oidc when oidc.issuer_url is set, else local
  # mode: ""
  # Hub user names that are admins besides accounts marked admin in Settings > Users: admins manage people and connect models (Settings > Models; models.admins can limit that per backend). The first local account is an admin
  # admins: []
  # CIDRs or addresses of the reverse proxies in front of the hub, such as 10.0.0.0/8 or 127.0.0.1. In proxy mode the hub reads the user header only on requests from them. In every mode the hub takes the client address for login limits from their X-Forwarded-For
  # trusted_proxies: []
  local:
    # Wrong passwords in a row that lock an account. 0 is the default
    max_failures: 5
    # How long a locked account stays locked. An admin can unlock it sooner by setting a new password. 0 is the default
    lockout: "15m"
  proxy:
    # Header that holds the user's identity: Remote-User (Authelia, Authentik), X-Auth-Request-User or X-Forwarded-User (oauth2-proxy), Tailscale-User-Login (tailscale serve). Not used with proxy.jwt.jwks_url
    user_header: "Remote-User"
    # Header with the user's display name. Not used with proxy.jwt.jwks_url
    name_header: "Remote-Name"
    # Header with the user's email address. Not used with proxy.jwt.jwks_url
    email_header: "Remote-Email"
    # Header with the user's groups, separated by commas or |, for backends[].groups. Not used with proxy.jwt.jwks_url
    groups_header: "Remote-Groups"
    # Make an account for each new identity the proxy sends. Off: only identities in users[] and accounts an admin made log in
    auto_create: false
    # Where Log out sends the browser after the hub's own logout, such as the proxy's logout page. Empty: the hub's start page
    # logout_url: ""
    jwt:
      # URL of the JSON Web Key Set that signs the proxy's tokens, such as https://<team>.cloudflareaccess.com/cdn-cgi/access/certs or the jwks_uri of the identity provider. Set: the hub reads the user from a verified token instead of user_header
      # jwks_url: ""
      # Header that holds the token: Authorization (Bearer), Cf-Access-Jwt-Assertion (Cloudflare Access) or the header an Envoy Gateway SecurityPolicy forwards the ID token in. Default Authorization when cookie is empty
      # header: ""
      # Cookie that holds the token, such as CF_Authorization. Read when header has none
      # cookie: ""
      # Token issuer (iss) to require. Required with jwks_url
      # issuer: ""
      # Audiences (aud) the hub accepts: the OIDC client ID, or the application AUD tag of Cloudflare Access. Empty: any audience
      # audiences: []
      # Claim that holds the user's identity, such as sub or email
      user_claim: "sub"
      # Claim with the user's display name
      name_claim: "preferred_username"
      # Claim with the user's email address
      email_claim: "email"
      # Claim with the user's groups, for backends[].groups
      groups_claim: "groups"
# Identities from the identity provider or proxy and their hub user names: each OIDC sub (auth.mode oidc) or proxy identity (auth.mode proxy). Not used in auth.mode local, whose accounts live in the database. Only settable in the config file
# users:
#   - sub: ""
#     name: ""
hermes:
  # Base URL of a Hermes Webapp listener, such as http://hermes:9120. Set: the hub adds a backend with id hermes that every hub user may use, in front of backends[]
  # url: ""
  # Display name of that backend
  name: "Hermes"
  # Hermes dashboard user name of that backend. Required with url
  # username: ""
  # Hermes dashboard password of that backend. Required with url unless password_file is set
  # password: "(secret)"
  # File that holds hermes.password. Wins over password
  # password_file: ""
  # Let users pair talaria computers with that backend, as backends[].devices
  devices: false
# Hermes backends and who may use them. Only settable in the config file; for one backend, hermes.* works from environment variables too
# backends:
#   - id: ""
#     name: ""
#     url: ""
#     provider: ""
#     username: ""
#     password: "(secret)"
#     password_file: ""
#     users: []
#     groups: []
#     everyone: false
#     cwd: ""
#     show_reasoning: false
#     devices: false
#     acp_url: ""
#     media_roots: []
#     service_devices:
#       - id: ""
#         name: ""
#         token: "(secret)"
#         token_file: ""
#     honcho:
#       url: ""
#       workspace: ""
#       user_peer: ""
#       ai_peer: ""
#       api_key: "(secret)"
#       api_key_file: ""
#       api_key_env: ""
#     agent_messages: false
telegram:
  # Run the Telegram bot
  enabled: false
  # Telegram bot token from BotFather. Required with enabled unless token_file is set
  # token: "(secret)"
  # File that holds telegram.token. Wins over token
  # token_file: ""
  # Telegram Bot API base URL
  api_url: "https://api.telegram.org"
  # Default backend per hub user, as user=backend pairs. A user without one gets their first backend
  # default_backends: []
  # Group chat IDs the bot answers in. The bot ignores every other group
  # allowed_groups: []
  # Long poll timeout for getUpdates
  poll_timeout: "50s"
  # Minimum time between edits of one live message
  edit_interval: "1500ms"
  # Retries of a Bot API call that Telegram answers with 429
  max_retries: 5
  # With store.driver postgres, only one hub replica runs the bot. This is how often each other replica checks whether the bot has no leader and takes over
  leader_retry: "2s"
  # How often the bot reads the chats of each linked group to add topics for new chats, rename topics and follow the chats that run
  topic_sync: "20s"
  # How the status line of a turn shows its steps and thinking: collapsed (a quote that opens on a tap), expanded, or off
  steps: "collapsed"
  # In private chats, stream each turn into a draft (sendMessageDraft) that shows what runs and the reply as it is written, instead of editing the status line
  drafts: true
device:
  # Serve the talaria device API under /api/device/ and the pairing page /device/pair. Backends also need backends[].devices
  enabled: false
  # Ed25519 private key that signs the hub's device assertions: a PEM PRIVATE KEY block (openssl genpkey -algorithm ed25519) or the 32-byte seed in base64. Required with device.enabled unless signing_key_file is set
  # signing_key: "(secret)"
  # File that holds device.signing_key. Wins over signing_key
  # signing_key_file: ""
  # How long a pairing code from talaria setup or talaria login stays valid
  pairing_ttl: "10m"
  # How often a device may poll while it waits for the user to confirm pairing
  poll_interval: "5s"
  # How often the hub checks that each open device connection's device is not revoked and that its user may still use its backend. A revoke closes the device's connections on the replica that served it at once, and on other replicas within this time
  recheck_interval: "10s"
  # CIDRs of proxies in front of the hub, such as 10.0.0.0/8. For a request from one of them the hub takes the device's address from X-Forwarded-For. Empty: the address of the TCP peer
  # trusted_proxies: []
notify:
  # Web Push (VAPID) private key: a P-256 key as a PEM block (openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt) or the raw 32 bytes in base64url. Empty with no vapid_private_key_file: no Web Push. Keep it: a new key ends every browser's subscription
  # vapid_private_key: "(secret)"
  # File that holds notify.vapid_private_key. Wins over vapid_private_key
  # vapid_private_key_file: ""
  # How push services can reach the hub's operator: a mailto: or https: URL. Default http.public_url when that is https. With neither, the hub logs a warning and runs without Web Push
  # vapid_subject: ""
  # How long an approval or question waits before the hub reminds its person once. 0 is the default
  remind_after: "5m"
  # How often the hub looks for running chats that nobody has open, to see their approvals and questions. 0 is the default
  watch_interval: "15s"
  # How often the hub reads each backend's scheduled jobs for their results and failures. 0 is the default
  job_interval: "1m"
claude:
  # Who may sign the Claude accounts of a backend in from the hub, as user=backend pairs. They see the sign-in controls and get the sign-in notices; the backend's other users see only usage. Empty: nobody
  # admins: []
  # IANA time zone of the reset times of Claude usage windows and of the days of Claude Code usage. Default: ui.time_zone
  # time_zone: ""
models:
  # Who may connect models to a backend's Hermes from the hub (Settings > Models, Connect a model), as user=backend pairs, the same form as claude.admins. Once set, only these pairs may, also for hub admins. Empty: the hub's admins (auth.admins and accounts marked admin), on every backend they use
  # admins: []
agent:
  # Who may change a backend's agent from the hub (Settings > Agent, Skills and tools, Diagnostics, and the switches in a chat), as user=backend pairs, the same form as models.admins. Once set, only these pairs may, also for hub admins. Empty: the hub's admins, on every backend they use
  # admins: []
  # Agent settings the install owns, shown read-only in Settings with "Set in the deployment config": approvals.mode, compression.enabled, compression.threshold, timezone, soul (the personality), tools.<toolset>, skills.<skill> or mcp_servers.<name>. A key also locks the keys under it. The Helm chart sets the keys of hermes.config here
  # locked_keys: []
updates:
  # Check Talaria's public releases once a day (read only) and show admins a banner when the hub, the agent or a computer is behind. Members never see it
  check: true
  # Releases feed to check, in the GitHub releases API form. Empty: Talaria's own repository
  # url: ""
